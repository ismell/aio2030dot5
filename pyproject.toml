[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "aio2030dot5"
dynamic = ["version"]
description = "Async client for IEEE 2030.5 (SEP 2.0) HAN smart meters, e.g. Itron Gen5 Riva (Xcel Energy Launchpad)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["cryptography>=43"]
classifiers = [
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
  "Typing :: Typed",
]

[project.optional-dependencies]
zeroconf = ["zeroconf>=0.130"]

[tool.hatch.version]
path = "src/aio2030dot5/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/aio2030dot5"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# The CLI owns its event loop and nothing else runs on it; small blocking
# reads/writes of cert and profile files there are harmless.
"src/aio2030dot5/__main__.py" = ["ASYNC240"]

[tool.mypy]
strict = true
python_version = "3.12"

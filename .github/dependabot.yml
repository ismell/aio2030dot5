version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    # A library: update the lock (what CI tests), never raise the minimum
    # versions users get (cryptography>=43 must stay compatible with hosts).
    versioning-strategy: lockfile-only
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
